[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p3lo", email = "mysiacik@mysiacik.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.10.0",
    "isort>=9.0.2",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-openrouter>=0.2.9",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "langgraph>=1.2.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.4",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.16",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
